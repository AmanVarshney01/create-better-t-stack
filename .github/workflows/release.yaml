name: Release

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: [PR Preview Build]
    types: [completed]

permissions:
  contents: read

jobs:
  release:
    name: Release to NPM
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release):')
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Extract version from commit message
        id: version
        run: |
          VERSION=$(git log -1 --pretty=%s | sed -nE 's/^chore\(release\): ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Validate version format
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format '$VERSION'. Expected semver (x.y.z)"
            exit 1
          fi

      - name: Check if version already exists
        id: check-version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if npm view create-better-t-stack@$VERSION version 2>/dev/null; then
            echo "Version $VERSION already exists on NPM"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION is new"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Bun
        if: steps.check-version.outputs.exists == 'false'
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        if: steps.check-version.outputs.exists == 'false'
        run: bun install --frozen-lockfile

      - name: Update types package version
        if: steps.check-version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd packages/types
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Build types package
        if: steps.check-version.outputs.exists == 'false'
        run: cd packages/types && bun run build

      - name: Update template-generator package version and types dependency
        if: steps.check-version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd packages/template-generator
          jq --arg v "$VERSION" --arg dep "^$VERSION" '.version = $v | .dependencies["@better-t-stack/types"] = $dep' package.json > tmp.json && mv tmp.json package.json

      - name: Build template-generator package
        if: steps.check-version.outputs.exists == 'false'
        run: cd packages/template-generator && bun run build

      - name: Update CLI types and template-generator dependencies and version
        if: steps.check-version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd apps/cli
          jq --arg v "^$VERSION" '.dependencies["@better-t-stack/types"] = $v | .dependencies["@better-t-stack/template-generator"] = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Build CLI
        if: steps.check-version.outputs.exists == 'false'
        run: cd apps/cli && bun run build
        env:
          BTS_TELEMETRY: 1
          CONVEX_INGEST_URL: ${{ secrets.CONVEX_INGEST_URL }}
          UMAMI_CLI_WEBSITE_ID: ${{ secrets.UMAMI_CLI_WEBSITE_ID }}

      - name: Update create-bts alias package version
        if: steps.check-version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd packages/create-bts
          jq --arg v "$VERSION" --arg dep "^$VERSION" '.version = $v | .dependencies["create-better-t-stack"] = $dep' package.json > tmp.json && mv tmp.json package.json

      - name: Setup pnpm
        if: steps.check-version.outputs.exists == 'false'
        uses: pnpm/action-setup@v6
        with:
          version: latest

      # Gate all publishes on the smoke so a failure here doesn't leave a
      # partial release on npm (e.g. types/template-generator published but
      # create-better-t-stack broken).
      - name: Publish smoke test (npm, pnpm, bun)
        if: steps.check-version.outputs.exists == 'false'
        run: bun run smoke:publish

      - name: Publish types to NPM
        if: steps.check-version.outputs.exists == 'false'
        run: cd packages/types && npm publish --access public
        env:
          BTS_TELEMETRY: 1
          CONVEX_INGEST_URL: ${{ secrets.CONVEX_INGEST_URL }}
          UMAMI_CLI_WEBSITE_ID: ${{ secrets.UMAMI_CLI_WEBSITE_ID }}

      - name: Publish template-generator to NPM
        if: steps.check-version.outputs.exists == 'false'
        run: cd packages/template-generator && npm publish --access public
        env:
          BTS_TELEMETRY: 1
          CONVEX_INGEST_URL: ${{ secrets.CONVEX_INGEST_URL }}
          UMAMI_CLI_WEBSITE_ID: ${{ secrets.UMAMI_CLI_WEBSITE_ID }}

      - name: Publish CLI to NPM
        if: steps.check-version.outputs.exists == 'false'
        run: cd apps/cli && npm publish --access public
        env:
          BTS_TELEMETRY: 1
          CONVEX_INGEST_URL: ${{ secrets.CONVEX_INGEST_URL }}
          UMAMI_CLI_WEBSITE_ID: ${{ secrets.UMAMI_CLI_WEBSITE_ID }}

      - name: Publish create-bts alias to NPM
        if: steps.check-version.outputs.exists == 'false'
        run: cd packages/create-bts && npm publish --access public
        env:
          BTS_TELEMETRY: 1
          CONVEX_INGEST_URL: ${{ secrets.CONVEX_INGEST_URL }}
          UMAMI_CLI_WEBSITE_ID: ${{ secrets.UMAMI_CLI_WEBSITE_ID }}

      - name: Create and push tag
        if: steps.check-version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config --local user.email "amanvarshney.work@gmail.com"
          git config --local user.name "Aman Varshney"
          if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push --tags
          else
            echo "Tag v$VERSION already exists, skipping"
          fi

      - name: Create GitHub Release
        if: steps.check-version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            bunx changelogithub
          else
            echo "Release v$VERSION already exists, skipping"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        if: steps.check-version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "## Release v$VERSION Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Packages" >> $GITHUB_STEP_SUMMARY
          echo "- [create-better-t-stack@$VERSION](https://www.npmjs.com/package/create-better-t-stack/v/$VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "- [create-bts@$VERSION](https://www.npmjs.com/package/create-bts/v/$VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "- [@better-t-stack/types@$VERSION](https://www.npmjs.com/package/@better-t-stack/types/v/$VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "- [@better-t-stack/template-generator@$VERSION](https://www.npmjs.com/package/@better-t-stack/template-generator/v/$VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GitHub Release" >> $GITHUB_STEP_SUMMARY
          echo "[v$VERSION](https://github.com/${{ github.repository }}/releases/tag/v$VERSION)" >> $GITHUB_STEP_SUMMARY

  publish-preview:
    name: PR Preview Publish
    permissions:
      actions: read
      contents: read
      pull-requests: write
      id-token: write
    concurrency:
      group: pr-preview-publish-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    steps:
      # Never check out or execute PR code in this privileged job.
      - name: Validate preview request
        id: request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.path !== '.github/workflows/pr-preview.yaml') {
              throw new Error('Unexpected preview workflow path');
            }
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo, commit_sha: run.head_sha,
            });
            const pull = pulls.find(pr => pr.state === 'open' &&
              pr.base.repo.full_name === `${context.repo.owner}/${context.repo.repo}` &&
              pr.head.sha === run.head_sha && pr.labels.some(label => label.name === 'preview'));
            if (!pull) throw new Error('No current, open, preview-labeled PR matches this build');
            core.setOutput('pr', String(pull.number));
            core.setOutput('sha', pull.head.sha);
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: preview-packages
          path: ${{ runner.temp }}/preview-packages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate package archives
        id: validate
        env:
          PR_NUMBER: ${{ steps.request.outputs.pr }}
          COMMIT_SHA: ${{ steps.request.outputs.sha }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, re, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'preview-packages'
          expected = {'@better-t-stack/types', '@better-t-stack/template-generator', 'create-better-t-stack', 'create-bts'}
          validated = pathlib.Path(os.environ['RUNNER_TEMP']) / 'validated-preview'
          validated.mkdir()
          found, versions = set(), set()
          archives = list(root.iterdir())
          if len(archives) != 4:
              raise ValueError('Expected exactly four package archives')
          for archive in archives:
              if archive.is_symlink() or not archive.is_file() or archive.suffix != '.tgz':
                  raise ValueError('Unexpected artifact entry')
              with tarfile.open(archive, 'r:gz') as tar:
                  members = tar.getmembers()
                  if any(not (m.isfile() or m.isdir()) or not m.name.startswith('package/') or '..' in pathlib.PurePosixPath(m.name).parts for m in members):
                      raise ValueError('Unsafe archive entry')
                  if sum(m.name == 'package/package.json' for m in members) != 1:
                      raise ValueError('Expected one package manifest')
                  manifest = json.load(tar.extractfile('package/package.json'))
              name, version = manifest.get('name'), manifest.get('version', '')
              suffix = f"-pr{os.environ['PR_NUMBER']}.{os.environ['COMMIT_SHA'][:7]}"
              if name not in expected or name in found or not re.fullmatch(r'\d+\.\d+\.\d+' + re.escape(suffix), version):
                  raise ValueError('Unexpected package identity or preview version')
              if manifest.get('publishConfig', {}) != {'access': 'public'}:
                  raise ValueError('Unexpected publish configuration')
              for dependency, required in manifest.get('dependencies', {}).items():
                  if dependency in expected and required != version:
                      raise ValueError('Preview workspace dependency mismatch')
              found.add(name)
              versions.add(version)
              # Use fixed filenames for publishing; no artifact paths enter shell code.
              archive.rename(validated / (name.rsplit('/', 1)[-1] + '.tgz'))
          if found != expected or len(versions) != 1:
              raise ValueError('Incomplete or inconsistent preview packages')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"version={versions.pop()}\npr={os.environ['PR_NUMBER']}\ntag=pr{os.environ['PR_NUMBER']}\ncommit={os.environ['COMMIT_SHA'][:7]}\n")
          PYTHON
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # npm trusted publishing is configured for release.yaml; use its OIDC identity.
      - name: Publish validated archives without lifecycle scripts
        working-directory: ${{ runner.temp }}
        env:
          NPM_TAG: ${{ steps.validate.outputs.tag }}
        run: |
          for PACKAGE in types template-generator create-better-t-stack create-bts; do
            npm publish "$RUNNER_TEMP/validated-preview/$PACKAGE.tgz" --ignore-scripts --access public --provenance --tag "$NPM_TAG" --registry https://registry.npmjs.org
          done

      - name: Find existing preview comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        id: find-comment
        with:
          issue-number: ${{ steps.validate.outputs.pr }}
          comment-author: "github-actions[bot]"
          body-includes: "PR Preview Release"

      - name: Create or update PR comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ steps.validate.outputs.pr }}
          edit-mode: replace
          body: |
            ## PR Preview Release

            A preview version has been published for this PR.

            | Package | Version | NPM Tag |
            |---------|---------|---------|
            | `create-better-t-stack` | `${{ steps.validate.outputs.version }}` | `pr${{ steps.validate.outputs.pr }}` |
            | `create-bts` | `${{ steps.validate.outputs.version }}` | `pr${{ steps.validate.outputs.pr }}` |
            | `@better-t-stack/types` | `${{ steps.validate.outputs.version }}` | `pr${{ steps.validate.outputs.pr }}` |
            | `@better-t-stack/template-generator` | `${{ steps.validate.outputs.version }}` | `pr${{ steps.validate.outputs.pr }}` |

            **Commit:** `${{ steps.validate.outputs.commit }}`

            ### Install

            ```bash
            # Using the PR tag (always gets latest for this PR)
            bunx create-better-t-stack@pr${{ steps.validate.outputs.pr }}
            npx create-better-t-stack@pr${{ steps.validate.outputs.pr }}

            # Using exact version
            bunx create-better-t-stack@${{ steps.validate.outputs.version }}
            npx create-better-t-stack@${{ steps.validate.outputs.version }}

            # Using the alias
            bunx create-bts@pr${{ steps.validate.outputs.pr }}
            npx create-bts@pr${{ steps.validate.outputs.pr }}
            ```

            ### NPM Links
            - [create-better-t-stack@${{ steps.validate.outputs.version }}](https://www.npmjs.com/package/create-better-t-stack/v/${{ steps.validate.outputs.version }})
            - [create-bts@${{ steps.validate.outputs.version }}](https://www.npmjs.com/package/create-bts/v/${{ steps.validate.outputs.version }})
            - [@better-t-stack/types@${{ steps.validate.outputs.version }}](https://www.npmjs.com/package/@better-t-stack/types/v/${{ steps.validate.outputs.version }})
            - [@better-t-stack/template-generator@${{ steps.validate.outputs.version }}](https://www.npmjs.com/package/@better-t-stack/template-generator/v/${{ steps.validate.outputs.version }})

            ---
            *To publish a new preview after more commits, remove and re-add the `preview` label.*
