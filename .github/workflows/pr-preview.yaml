name: PR Preview Build

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.label.name == 'preview'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        env:
          BTS_TELEMETRY: 0
      - name: Set preview package versions
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE_VERSION=$(jq -r '.version' apps/cli/package.json | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          VERSION="${BASE_VERSION}-pr${PR_NUMBER}.${COMMIT_SHA:0:7}"
          for PACKAGE in packages/types packages/template-generator apps/cli packages/create-bts; do
            jq --arg v "$VERSION" '
              .version = $v |
              if .dependencies["@better-t-stack/types"] then .dependencies["@better-t-stack/types"] = $v else . end |
              if .dependencies["@better-t-stack/template-generator"] then .dependencies["@better-t-stack/template-generator"] = $v else . end |
              if .dependencies["create-better-t-stack"] then .dependencies["create-better-t-stack"] = $v else . end
            ' "$PACKAGE/package.json" > "$PACKAGE/package.json.tmp"
            mv "$PACKAGE/package.json.tmp" "$PACKAGE/package.json"
          done
      - run: bun run build:cli
        env:
          BTS_TELEMETRY: 0
      - name: Pack preview packages
        run: |
          mkdir -p "$RUNNER_TEMP/preview-packages"
          for PACKAGE in packages/types packages/template-generator apps/cli packages/create-bts; do
            (cd "$PACKAGE" && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/preview-packages")
          done
      - uses: actions/upload-artifact@v7
        with:
          name: preview-packages
          path: ${{ runner.temp }}/preview-packages/*.tgz
          if-no-files-found: error
          retention-days: 3
