name: Varlock Templates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - packages/template-generator/**
      - apps/cli/src/**
      - scripts/varlock-smoke.ts
      - scripts/varlock-docker-smoke.ts
      - docs/maintenance/varlock-migration.md
      - .github/workflows/varlock-smoke.yaml

permissions:
  contents: read

concurrency:
  group: varlock-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  varlock-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
        env:
          BTS_TELEMETRY: 0
      - run: bun run scripts/varlock-smoke.ts

  docker-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        frontend: [none, next, nuxt, solid]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
        env:
          BTS_TELEMETRY: 0
      - run: bun run build:cli
      - run: bun run scripts/varlock-docker-smoke.ts "${{ matrix.frontend }}"
