name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: test-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          check-latest: true
          package-manager-cache: false

      - name: Setup Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile
        env:
          BTS_TELEMETRY: 0

      - name: Build CLI and Shared Packages
        run: bun run build:cli

      - name: Check Formatting and Lint
        run: bunx oxfmt --check . && bunx oxlint .

      - name: Check Source Types
        run: |
          bunx tsc --noEmit -p apps/cli/tsconfig.json
          bunx tsc --noEmit -p packages/template-generator/tsconfig.json
          bunx tsc --noEmit -p packages/backend/convex/tsconfig.json
          bun run --filter web check-types

      - name: Test Website and Shared Packages
        run: bun test apps/web/test packages/types/test packages/backend/test

      - name: Test CLI
        working-directory: apps/cli
        run: bun run test:ci
        env:
          AGENT: 1
          BTS_TELEMETRY: 0
          BTS_MATRIX_MODE: smoke

  generated-builds:
    name: Generated Build (${{ matrix.sample }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sample:
          - hono-trpc-drizzle-todo
          - solid-v2-frontend-only
          - solid-v2-self-vercel-npm
          - solid-v2-pwa
          - expo-convex-better-auth-polar
          - workers-
          - nuxt-orpc
          - solid-v2-fastify-node-prisma-polar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          check-latest: true
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - run: bun install --frozen-lockfile
      - run: bun run build:cli
      - name: Install, Build and Type-check Generated Projects
        working-directory: apps/cli
        run: bun test test/generated-builds.test.ts
        env:
          AGENT: 1
          BTS_TELEMETRY: 0
          BTS_BUILD_SAMPLES: 1
          BTS_BUILD_SAMPLE_FILTER: ${{ matrix.sample }}
